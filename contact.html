  <body>
    <header class="main">
      <nav>
        <a href="#" class="logo">Derartu</a>

    <header class="sub">
      <h1>Contact Me☎️</h1>
      <p>
        Feel free to reach out to me through the form below. I look forward to
        hearing from you!
      </p>
    </header>

    <form action="https://formspree.io/f/xjkkpldz" method="POST">
      <div class="container">
        <div class="form-group">
          <label for="full-name"></label>
          <input
            type="text"
            id="full-name"
            name="Full Name"
            placeholder="Full Name"
            required
          />
        </div>
        <div class="form-group">
          <label for="email-address"></label>
          <input
            type="email"
            id="email-address"
            name="Email"
            placeholder="Email Address"
            required
          />
        </div>
        <div class="form-group">
          <label for="mobile-number"></label>
          <input
            type="tel"
            id="mobile-number"
            name="Mobile"
            placeholder="Mobile Number"
            required
          />
        </div>
        <div class="form-group">
          <label for="email-subject"></label>
          <input
            type="text"
            id="email-subject"
            name="Subject"
            placeholder="Email Subject"
            required
          />
        </div>
        <div class="form-group">
          <label for="dialogue-box"></label>
          <textarea
            id="dialogue-box"
            name="Message"
            placeholder="Your Message"
            required
          ></textarea>
        </div>
        <div class="form-group">
          <button type="submit">Submit</button>
        </div>
      </div>
    </form>

    <br />
